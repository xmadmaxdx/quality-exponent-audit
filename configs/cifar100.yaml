data:
  dataset: cifar100
  root: data
  image_size: 32
  batch_size: 128
  num_workers: 2
quality:
  operator: label_flip
  quality: 1.0
  seed: 0
model:
  name: resnet20
  num_classes: 100
  width: 16
train:
  epochs: 30
  lr: 0.1
  weight_decay: 0.0005
  optimizer: sgd
  momentum: 0.9
  seed: 0
  checkpoint_dir: outputs/runs
study:
  name: main
  n_val: 2000
  grid_sizes: [15, 30, 60, 120]
  min_seeds: 5
  operators: [label_flip, label_noise, pixel_gaussian, pixel_blur, pixel_mask, duplicate]